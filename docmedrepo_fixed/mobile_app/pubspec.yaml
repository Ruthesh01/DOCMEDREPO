name: docmedrepo
description: Secure medical records mobile app — Flutter

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ───────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── HTTP & API ─────────────────────────────────────────────────────────────
  http: ^1.2.1
  http_parser: ^4.0.2

  # ── Secure storage (JWT tokens — never SharedPreferences) ─────────────────
  flutter_secure_storage: ^9.0.0

  # ── Local cache ────────────────────────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Firebase (FCM push notifications) ─────────────────────────────────────
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.0

  # ── Biometric authentication ───────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── QR code generation & scanning ─────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # ── File handling ──────────────────────────────────────────────────────────
  file_picker: ^8.1.0

  # ── UI utilities ───────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

